# leisaac-docker
#   sim   : Isaac Sim + LeIsaac (テレオペ / リプレイ / 推論クライアント)
#   gr00t : GR00T N1.5 推論サーバ (profile: inference。sim と ZMQ :5555 で通信)

# バージョンの組み合わせはここで一括管理する。
# leisaac の GR00T クライアントは特定の Isaac-GR00T commit を前提とするため、LEISAAC_REF と GR00T_REF は必ず組で更新すること。
x-versions: &versions
  ISAACSIM_VERSION: "5.1.0"
  LEISAAC_REF: "v0.4.0"
  GR00T_REF: "4af2b622892f7dcb5aae5a3fb70bcb02dc217b96"
  TORCH_VERSION: "2.7.0"
  TORCHVISION_VERSION: "0.22.0"
  UID: ${HOST_UID:-1000}
  GID: ${HOST_GID:-1000}

x-gpu: &gpu
  gpus: all
  network_mode: host
  ipc: host

services:
  sim:
    <<: *gpu
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: sim
      args: *versions
    image: leisaac-sim:latest
    container_name: leisaac-sim
    environment:
      - DISPLAY=${DISPLAY}
      - QT_X11_NO_MITSHM=1
    # ゲームパッド (/dev/input/js*: char major 13, group input) とシリアル (dialout) へのアクセス
    group_add:
      - "${INPUT_GID:-107}"
      - "20"
    device_cgroup_rules:
      - 'c 13:* rmw'
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - ~/.Xauthority:/home/dev/.Xauthority:ro
      - /dev/input:/dev/input
      - /run/udev:/run/udev:ro
      - ./data:/workspace/data
      - ./assets:/workspace/leisaac/assets
      - ./data/calibration:/workspace/leisaac/source/leisaac/leisaac/devices/lerobot/.cache
      # Isaac Sim のキャッシュ (シェーダ / メッシュ等。初回起動で数百 MB)
      - sim-kit-cache:/opt/venv/lib/python3.11/site-packages/isaacsim/kit/cache
      - sim-ov-cache:/home/dev/.cache/ov
      - sim-gl-cache:/home/dev/.cache/nvidia/GLCache
      - sim-compute-cache:/home/dev/.nv/ComputeCache
    tty: true
    stdin_open: true

  gr00t:
    <<: *gpu
    profiles: [inference]
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: gr00t
      args: *versions
    image: leisaac-gr00t:latest
    container_name: leisaac-gr00t
    environment:
      - HF_HOME=/workspace/data/.cache
    volumes:
      - ./data:/workspace/data
    command:
      - python
      - /opt/tools/gr00t_server.py
      - --server
      - --model_path=${POLICY_DIR:-/workspace/data/policies/leisaac-pick-orange-v0}
      - --embodiment_tag=new_embodiment
      - --data_config=${GR00T_DATA_CONFIG:-so100_dualcam}
      - --port=5555
    healthcheck:
      test: ["CMD", "python", "/opt/tools/probe_gr00t.py", "--ping"]
      interval: 10s
      timeout: 10s
      start_period: 180s
      retries: 3

volumes:
  sim-kit-cache:
  sim-ov-cache:
  sim-gl-cache:
  sim-compute-cache:
