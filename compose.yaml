services:
  sim:
    build:
      context: .
      dockerfile: Dockerfile.sim
    image: leisaac_sim:latest
    container_name: leisaac_sim
    runtime: nvidia
    working_dir: /workspace/leisaac
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=all
      - DISPLAY=${DISPLAY}
      - QT_X11_NO_MITSHM=1
      - OMNI_KIT_ACCEPT_EULA=YES
      - PYTHONUNBUFFERED=1
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - ~/.Xauthority:/root/.Xauthority:rw
      - /dev/input:/dev/input
      - /run/udev:/run/udev:ro
      - ./code:/workspace/code
      - ./data:/workspace/data
      - ./assets:/workspace/leisaac/assets
      - ./data/calibration:/workspace/leisaac/source/leisaac/leisaac/devices/lerobot/.cache
      - isaac-cache-ov:/root/.cache/ov
      - isaac-cache-gl:/root/.cache/nvidia/GLCache
      - isaac-cache-compute:/root/.nv/ComputeCache
      # pip 版 Isaac Sim のシェーダ/メッシュキャッシュ (実測: 初回起動で約340MB 書き込まれる)
      - isaac-cache-kit:/opt/conda/envs/sim/lib/python3.11/site-packages/isaacsim/kit/cache
    # ゲームパッド (/dev/input/js*, major 13) の読み取り許可
    device_cgroup_rules:
      - 'c 13:* rmw'
    network_mode: host
    ipc: host
    tty: true
    stdin_open: true
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [ gpu, compute, utility, graphics ]

  brain:
    build:
      context: .
      dockerfile: Dockerfile.brain
    image: lerobot_brain:latest
    container_name: lerobot_brain
    runtime: nvidia
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=all
      - HF_HOME=/workspace/data/.cache
    volumes:
      - ./code:/workspace/code
      - ./data:/workspace/data
    network_mode: host
    ipc: host
    tty: true
    stdin_open: true
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [ gpu ]

volumes:
  isaac-cache-ov:
  isaac-cache-gl:
  isaac-cache-compute:
  isaac-cache-kit:
