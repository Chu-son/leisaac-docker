# leisaac-docker
#   sim   : Isaac Sim + LeIsaac (テレオペ / リプレイ / 推論クライアント)。常駐させず、make が run --rm で都度実行する
#   gr00t : GR00T N1.5 推論サーバ (profile: inference。sim と ZMQ :5555 で通信)
#   train : LeRobot (記録の変換と学習)。sim と同じく、make が run --rm で都度実行する

# git の ref はここで一括管理する (Python パッケージのバージョンは docker/envs/*/pyproject.toml と uv.lock)。
# leisaac の GR00T クライアントは特定の Isaac-GR00T commit を前提とするため、LEISAAC_REF と GR00T_REF は必ず組で更新すること。
# ref を変えたら make lock で uv.lock を更新する (更新を忘れるとビルドが失敗する)。
x-versions: &versions
  LEISAAC_REF: "1651c321e9b0c1bb54233211fc7b3cd70d8373d5" # v0.4.0
  GR00T_REF: "4af2b622892f7dcb5aae5a3fb70bcb02dc217b96"
  UID: ${HOST_UID:-1000}
  GID: ${HOST_GID:-1000}

x-gpu: &gpu
  gpus: all
  network_mode: host
  ipc: host

services:
  sim:
    <<: *gpu
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: sim
      args: *versions
    image: leisaac-sim:latest
    environment:
      - DISPLAY=${DISPLAY}
      - QT_X11_NO_MITSHM=1
    # ゲームパッド (/dev/input/js*: char major 13, group input) とシリアル (dialout) へのアクセス
    group_add:
      - "${INPUT_GID:-107}"
      - "20"
    device_cgroup_rules:
      - 'c 13:* rmw'
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - ~/.Xauthority:/home/dev/.Xauthority:ro
      - /dev/input:/dev/input
      - /run/udev:/run/udev:ro
      - ./data:/workspace/data
      - ./assets:/workspace/leisaac/assets
      - ./data/calibration:/workspace/leisaac/source/leisaac/leisaac/devices/lerobot/.cache
      # Isaac Sim のキャッシュ (シェーダ / メッシュ等。初回起動で数百 MB)
      - sim-kit-cache:/opt/venv/lib/python3.11/site-packages/isaacsim/kit/cache
      - sim-ov-cache:/home/dev/.cache/ov
      - sim-gl-cache:/home/dev/.cache/nvidia/GLCache
      - sim-compute-cache:/home/dev/.nv/ComputeCache

  gr00t:
    <<: *gpu
    profiles: [inference]
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: gr00t
      args: *versions
    image: leisaac-gr00t:latest
    environment:
      - HF_HOME=/workspace/data/.cache
    volumes:
      - ./data:/workspace/data
    command:
      - python
      - /opt/tools/gr00t_server.py
      - --server
      - --model_path=${POLICY_DIR:-/workspace/data/policies/leisaac-pick-orange-v0}
      - --embodiment_tag=new_embodiment
      - --data_config=${GR00T_DATA_CONFIG:-so100_dualcam}
      - --port=5555
    healthcheck:
      test: ["CMD", "python", "/opt/tools/probe_gr00t.py", "--ping"]
      interval: 10s
      timeout: 10s
      start_period: 180s
      retries: 3

  train:
    <<: *gpu
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: train
      args: *versions
    image: leisaac-train:latest
    volumes:
      - ./data:/workspace/data

  # make lock 用。ソースを取得した stage で uv lock を実行し、結果を docker/envs/ に書き戻す
  lock-sim:
    profiles: [tools]
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: sim-src
      args: *versions
    image: leisaac-sim-src:latest
    working_dir: /opt/env/sim
    volumes:
      - ./docker/envs/sim:/opt/env/sim
    command: ["uv", "lock"]

  lock-gr00t:
    profiles: [tools]
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: gr00t-src
      args: *versions
    image: leisaac-gr00t-src:latest
    working_dir: /opt/env/gr00t
    volumes:
      - ./docker/envs/gr00t:/opt/env/gr00t
    command: ["uv", "lock"]

  lock-train:
    profiles: [tools]
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: train-src
      args: *versions
    image: leisaac-train-src:latest
    working_dir: /opt/env/train
    volumes:
      - ./docker/envs/train:/opt/env/train
    command: ["uv", "lock"]

volumes:
  sim-kit-cache:
  sim-ov-cache:
  sim-gl-cache:
  sim-compute-cache:
